name: Publish Community Maps Android Beta

on:
  push:
    tags:
      - "beta-community-maps-*"

permissions:
  contents: read

concurrency:
  group: publish-android-beta-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore existing production signing and Firebase client configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/gridfall-release.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf 'storeFile=keystore/gridfall-release.keystore\n' > keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties
      - name: Test and build signed production-API beta
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain --max-workers=2
      - name: Verify public signing identity and prepare assets
        run: |
          set -euo pipefail
          apk=Gridfall-Community-Maps-Beta.apk
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/beta-signature.txt"
          python3 - <<'PYCERT'
          import os, re
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP'], 'beta-signature.txt').read_text()
          match = re.search(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})', report)
          if not match:
              raise SystemExit('Cannot identify signing certificate; refusing publication')
          actual = match.group(1).lower()
          print('Beta signing certificate SHA-256:', actual)
          expected = 'cb43563295f8134b162e71dfe43db34f325d4f22336129aa5dc825c6ad221d24'
          if actual != expected:
              raise SystemExit('Signing certificate differs from website production APK; refusing publication')
          PYCERT
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/beta-metadata.txt"
          grep -F "package: name='com.example.gridfall' versionCode='22' versionName='1.8.0-beta.1'" "$RUNNER_TEMP/beta-metadata.txt"
          python3 - <<'PYCONFIG'
          import json
          with open('app/google-services.json') as f:
              config = json.load(f)
          assert config['project_info']['project_id'] == 'gridfall-auth'
          assert any(c['client_info']['android_client_info']['package_name'] == 'com.example.gridfall' for c in config['client'])
          PYCONFIG
          sha256sum "$apk" > "$apk.sha256"
      - name: Publish GitHub prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --latest=false \
            --title "Community Maps Beta — 1.8.0-beta.1" \
            --notes-file docs/community-maps-beta-release-notes.md \
            Gridfall-Community-Maps-Beta.apk Gridfall-Community-Maps-Beta.apk.sha256
      - name: Remove restored signing material
        if: always()
        run: rm -f keystore.properties keystore/gridfall-release.keystore app/google-services.json
