services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gridfall
      POSTGRES_USER: gridfall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: ${GRIDFALL_DATABASE_STORAGE:?set an explicit isolated database storage path}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - gridfall-internal

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://gridfall:${POSTGRES_PASSWORD}@postgres:5432/gridfall?schema=public
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COMMUNITY_DOWNLOAD_SECRET: ${COMMUNITY_DOWNLOAD_SECRET:?set COMMUNITY_DOWNLOAD_SECRET}
    volumes:
      - type: bind
        source: ${GRIDFALL_FIREBASE_CREDENTIALS_FILE:?set an explicit credentials file path}
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8080:8080"
    networks:
      - gridfall-internal

networks:
  gridfall-internal:
    driver: bridge

